<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3학년 OO반 좌석 매칭 시스템</title>
    <style>
        /* 🎨 나무 테마 디자인 (CSS) */
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css");

        :root {
            --bg-color: #f7f5f0;          /* 따뜻한 베이지빛 크림색 배경 */
            --card-bg: #ffffff;           /* 카드 내부 화이트 */
            --text-main: #4a3b32;         /* 짙은 브라운 글자색 (눈이 편안한 정돈된 톤) */
            --text-muted: #8a7a71;        /* 부연 설명 글자색 */
            
            /* 🪵 나무 테마 포인트 컬러 */
            --primary: #8c6239;           /* 따뜻한 원목 브라운 (메인 버튼 및 강조) */
            --primary-hover: #6f4e2c;     
            --seat-default: #fffdf9;      /* 기본 좌석 배경 (밝은 아이보리) */
            --seat-border: #e6dfd5;       /* 기본 좌석 테두리 */
            --seat-select: #d7ccc8;       /* 좌석 선택 시 (부드러운 라떼 색상) */
            --success: #e28743;           /* 배정 완료 (따뜻한 오렌지 브라운) */
            --danger: #e07a5f;            /* 초기화 버튼 (차분한 테라코타 레드) */
            
            --border-radius: 16px;        /* 둥글둥글한 느낌을 주는 라운드 값 */
            --shadow: 0 10px 20px rgba(140, 98, 57, 0.05), 0 3px 6px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #5c3a21; /* 타이틀에 깊은 원목 색상 적용 */
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 35px;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        /* 카드 서식 (입력창 서식과 배치도 감싸는 상자) */
        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            flex: 1;
            min-width: 340px;
            border: 1px solid rgba(230, 223, 213, 0.5);
        }

        /* 🪵 교탁/칠판 디자인: 단단한 통원목 느낌 */
        .teacher-desk {
            width: 60%;
            height: 45px;
            background: linear-gradient(135deg, #6f4e2c, #4a321a);
            color: #f7f5f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            border-radius: 30px; /* 알약 모양으로 부드럽게 */
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 10px rgba(74, 50, 26, 0.2);
            letter-spacing: 2px;
        }

        /* 5열 6행 그리드 */
        .classroom-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        /* 🪵 기본 좌석 스타일: 빈 책상 느낌 */
        .seat {
            aspect-ratio: 1.1;
            border: 2px dashed var(--seat-border); /* 기본 상태는 점선으로 부드럽게 */
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--seat-default);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .seat:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            background-color: #fdfbf7;
        }

        /* 🪵 학생이 지망을 선택했을 때: 라떼/소프트 브라운 톤 */
        .seat.selected {
            border-style: solid;
            border-color: var(--primary);
            background: linear-gradient(135deg, #f5ebe0, #e3d5ca);
            color: var(--primary);
            box-shadow: 0 4px 12px rgba(140, 98, 57, 0.15);
        }

        .seat-num {
            font-size: 11px;
            color: #b5a69e;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .student-name {
            font-size: 15px;
            font-weight: 700;
        }

        /* 입력 폼 서식 */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #5c4d43;
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e6dfd5;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            background-color: #faf9f6;
            color: var(--text-main);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(140, 98, 57, 0.15);
        }

        #selectedSequence {
            font-size: 13px;
            color: var(--primary);
            background: #f5ebe0;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 5px;
            line-height: 1.4;
        }

        /* 버튼 공통 스타일 */
        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(140, 98, 57, 0.2);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(140, 98, 57, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        /* 초기화 버튼 (차분하고 부드러운 붉은 벽돌색) */
        button.reset-btn {
            background: #f2e9e1;
            color: #bc4749;
            box-shadow: none;
            margin-top: 15px;
            font-size: 14px;
            padding: 10px;
        }
        button.reset-btn:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(224, 122, 95, 0.2);
        }

        /* 등록된 학생 명단 상자 */
        h3 {
            font-size: 16px;
            color: #5c4d43;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .student-list {
            background-color: #faf9f6;
            border: 1px solid #e6dfd5;
            border-radius: 12px;
            padding: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .student-item {
            padding: 8px 6px;
            border-bottom: 1px solid #f2e9e1;
            font-size: 13px;
            color: var(--text-muted);
        }
        .student-item:last-child {
            border-bottom: none;
        }

        /* 🎉 최종 배정 완료된 좌석 스타일: 따뜻한 황금빛 오크 나무 테마 */
        .assigned {
            border-style: solid !important;
            background: linear-gradient(135deg, #f7d6b5, #e28743) !important;
            border-color: #bd6320 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(226, 135, 67, 0.25);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .assigned .seat-num {
            color: rgba(255, 255, 255, 0.75) !important;
        }

        /* 배정 완료 시 뿅! 하고 나타나는 부드러운 애니메이션 */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 반응형 모바일 대응 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .card {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <h1>자연스러운 교실 좌석 배정 프로그램</h1>
    <p>학생의 이름과 1~5지망 좌석을 입력한 뒤 배정 버튼을 누르세요.</p>

    <div class="container">
        <!-- 왼쪽: 학생 정보 입력 -->
        <div class="card" style="max-width: 400px;">
            <div class="form-group">
                <label for="studentName">학생 이름</label>
                <input type="text" id="studentName" placeholder="예: 홍길동" autocomplete="off">
            </div>
            
            <div class="form-group">
                <label>희망 좌석 선택 (오른쪽 배치도에서 순서대로 5개 클릭)</label>
                <div id="selectedSequence">
                    선택된 지망: 없음
                </div>
            </div>

            <button onclick="addStudent()">학생 정보 등록</button>
            
            <hr style="border: 0; border-top: 1px solid var(--seat-border); margin: 20px 0;">
            
            <h3>등록된 학생 명단 (<span id="studentCount">0</span>명)</h3>
            <div class="student-list" id="studentList"></div>
            
            <button class="reset-btn" onclick="resetAll()">전체 초기화</button>
        </div>

        <!-- 오른쪽: 5x6 배치도 및 결과 -->
        <div class="card" style="max-width: 600px;">
            <div class="teacher-desk">칠 판 (교탁)</div>
            <div class="classroom-grid" id="classroomGrid"></div>
            <button onclick="startAssignment()" style="background: var(--success); box-shadow: 0 4px 12px rgba(226, 135, 67, 0.2);">랜덤 좌석 배정 시작! 🎲</button>
        </div>
    </div>

    <script>
        // 🧠 좌석 매칭 알고리즘 (JavaScript)
        const ROWS = 6;
        const COLS = 5;
        const TOTAL_SEATS = ROWS * COLS;

        let students = []; 
        let currentPreferences = []; 

        function createGrid() {
            const grid = document.getElementById('classroomGrid');
            grid.innerHTML = '';
            
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    const seatId = `${r}-${c}`;
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    seat.id = `seat-${seatId}`;
                    
                    seat.innerHTML = `
                        <span class="seat-num">${r}행 ${c}열</span>
                        <span class="student-name"></span>
                    `;
                    seat.onclick = () => selectSeat(seatId);
                    grid.appendChild(seat);
                }
            }
        }

        function selectSeat(seatId) {
            if (students.length > 0 && students[0].assignedSeat) return;

            const index = currentPreferences.indexOf(seatId);
            const seatElement = document.getElementById(`seat-${seatId}`);

            if (index > -1) {
                currentPreferences.splice(index, 1);
                seatElement.classList.remove('selected');
            } else {
                if (currentPreferences.length >= 5) {
                    alert('희망 좌석은 최대 5개까지만 선택할 수 있습니다.');
                    return;
                }
                currentPreferences.push(seatId);
                seatElement.classList.add('selected');
            }
            updatePreferenceText();
        }

        function updatePreferenceText() {
            const textDiv = document.getElementById('selectedSequence');
            if (currentPreferences.length === 0) {
                textDiv.innerText = "선택된 지망: 없음";
            } else {
                const formatted = currentPreferences.map((id, i) => `${i + 1}지망: ${id.split('-')[0]}행 ${id.split('-')[1]}열`).join(' | ');
                textDiv.innerText = formatted;
            }
        }

        function addStudent() {
            const nameInput = document.getElementById('studentName');
            const name = nameInput.value.trim();

            if (!name) {
                alert('학생 이름을 입력해주세요.');
                return;
            }
            if (students.some(s => s.name === name)) {
                alert('이미 등록된 학생 이름입니다.');
                return;
            }
            if (currentPreferences.length < 5) {
                alert('희망 좌석을 5개 모두 선택해야 등록할 수 있습니다.');
                return;
            }
            if (students.length >= TOTAL_SEATS) {
                alert(`교실 좌석 수(${TOTAL_SEATS}명)를 초과하여 등록할 수 없습니다.`);
                return;
            }

            students.push({
                name: name,
                preferences: [...currentPreferences], 
                assignedSeat: null
            });

            nameInput.value = '';
            currentPreferences = [];
            updatePreferenceText();
            document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));

            updateStudentList();
        }

        function updateStudentList() {
            document.getElementById('studentCount').innerText = students.length;
            const listDiv = document.getElementById('studentList');
            listDiv.innerHTML = '';
            
            students.forEach(s => {
                const item = document.createElement('div');
                item.className = 'student-item';
                const prefText = s.preferences.map(p => `${p.split('-')[0]}행${p.split('-')[1]}열`).join(', ');
                item.innerText = `${s.name} (지망: ${prefText})`;
                listDiv.appendChild(item);
            });
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function startAssignment() {
            if (students.length === 0) {
                alert('배정할 학생을 먼저 등록해주세요.');
                return;
            }

            createGrid(); 
            const allocatedSeats = new Set();
            let pool = students.map(s => ({ ...s, assignedSeat: null }));

            for (let choiceIndex = 0; choiceIndex < 5; choiceIndex++) {
                shuffle(pool);
                pool.forEach(student => {
                    if (!student.assignedSeat) {
                        const desiredSeat = student.preferences[choiceIndex];
                        if (!allocatedSeats.has(desiredSeat)) {
                            student.assignedSeat = desiredSeat;
                            allocatedSeats.add(desiredSeat);
                        }
                    }
                });
            }

            let allSeats = [];
            for (let r = 1; r <= ROWS; r++) {
                for (let c = 1; c <= COLS; c++) {
                    allSeats.push(`${r}-${c}`);
                }
            }
            
            let remainingSeats = allSeats.filter(seat => !allocatedSeats.has(seat));
            shuffle(remainingSeats);

            pool.forEach(student => {
                if (!student.assignedSeat) {
                    const randomSeat = remainingSeats.pop();
                    student.assignedSeat = randomSeat;
                    allocatedSeats.add(randomSeat);
                }
            });

            pool.forEach(student => {
                const seatElement = document.getElementById(`seat-${student.assignedSeat}`);
                if (seatElement) {
                    seatElement.classList.add('assigned'); 
                    seatElement.querySelector('.student-name').innerText = student.name;
                }
                const originalStudent = students.find(s => s.name === student.name);
                if (originalStudent) {
                    originalStudent.assignedSeat = student.assignedSeat;
                }
            });

            alert('🥳 모든 학생의 좌석 배정이 가장 공정하고 최적화된 방식으로 완료되었습니다!');
        }

        function resetAll() {
            if (confirm('등록된 학생 명단과 배치 결과가 모두 삭제됩니다. 정말 초기화하시겠습니까?')) {
                students = [];
                currentPreferences = [];
                document.getElementById('studentName').value = '';
                updatePreferenceText();
                updateStudentList();
                createGrid();
            }
        }

        createGrid();
    </script>
</body>
</html>
